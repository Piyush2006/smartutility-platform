# Render Blueprint -- provisions the whole stack (Postgres + backend +
# frontend) in one shot with everything cross-wired automatically:
# DATABASE_URL from the database, JWT_SECRET_KEY randomly generated,
# CORS_ORIGINS/FRONTEND_URL from the frontend's own Render URL, and
# NEXT_PUBLIC_API_URL from the backend's own Render URL.
#
# To use: Render dashboard -> New + -> Blueprint -> select this repo.
# Render reads this file and creates/updates all three resources with no
# further manual env var entry needed. (Redis/Celery are intentionally
# not included -- every scheduled job also has a synchronous "Generate
# Now" API the UI already uses, so they're optional infra, not required
# to run the app.)
databases:
  - name: utilityos-db
    plan: free
    databaseName: utilityos
    user: utilityos

services:
  - type: web
    name: utilityos-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: utilityos-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: utilityos-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: utilityos-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: utilityos-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: utilityos-api
          envVarKey: RENDER_EXTERNAL_URL
